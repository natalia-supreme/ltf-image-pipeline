# ============================================================
#  Team colour map
# ------------------------------------------------------------
#  Used to build the invented two-colour kit per fixture.
#  These are CLUB COLOURS (identity), not official kit designs
#  — the pipeline deliberately invents a non-official kit.
#
#  Hybrid lookup:
#    - team in this table  -> instant, hand-verified (the normal case)
#    - team NOT in table   -> pipeline does an ad-hoc search, then
#                             appends it here with auto: true so it
#                             is only searched once (and can be
#                             hand-corrected afterwards).
#
#  auto: false  = hand-verified, trusted
#  auto: true   = filled automatically by search, review recommended
#
#  Edit any colour freely — the pipeline always reads this file.
# ============================================================

teams:
