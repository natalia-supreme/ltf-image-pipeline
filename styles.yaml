      {away_primary} colour block with the only printed words
      'MATCH TICKET' and a generic seat/row number; a plain
      perforation line. Warm rim light, shallow depth of field,
      premium 8K, Nikon Z9 100mm. CRITICAL IP SAFETY: NO club or
      competition names, NO team names, NO logos, crests, sponsor or
      maker marks, NO real barcode, NO real venue; the only text
