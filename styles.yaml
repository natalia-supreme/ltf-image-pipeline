# ============================================================
#  STYLES — the single source of truth for creative styles
# ------------------------------------------------------------
#  This is the file Mark edits to add / change / disable styles.
#  Edit it, run `python3 build_styles.py`, commit & push — the new
#  style then shows up everywhere (pipeline + Lovable Styles list).
#  No code changes needed.
#
#  Each style:
#    key          unique id (used in filenames)
#    title        human label shown in the UI
#    category     head-to-head | club-spotlight | stadium-atmosphere
#    enabled      true/false — turn a style off without deleting it
#    has_players  true if it shows invented players. NOTE: Mark's
#                 direction (2026-05-18) is to move AWAY from fake
#                 players for VS matches → prefer supporters. These
#                 are flagged so they're easy to find and retire.
#    needs        which colour placeholders the prompt uses:
#                 [] none | [home] one team | [home, away] both
#    prompt       the text. Placeholders the pipeline fills:
#                 {home_primary} {home_secondary}
#                 {away_primary} {away_secondary}
#
#  To ADD YOUR OWN: copy a block, give it a new key, write your
#  prompt, set category/enabled/needs. That's it.
# ============================================================

styles:

  # ---------- HEAD-TO-HEAD ----------
  # NOTE: the four player-duel styles below have has_players: true.
  # Per Mark 2026-05-18 these are candidates to RETIRE in favour of
  # a rival-supporters VS concept (in design). Left enabled until the
  # supporter VS replacement is approved.

  - key: F-twocolour-duel
    title: "Halved-kit duel (HERO)"
    category: head-to-head
    enabled: true
    has_players: true
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, dramatic low
      pitch-level angle. Two anonymous footballers competing for a plain
      unbranded white-and-black football, explosive mid-action, motion
      blur, turf spray. Player one wears an invented non-official kit:
      bold 50/50 vertical halved shirt, left half {home_primary}, right
      half {home_secondary}, plain white number, {home_primary} shorts
      with {home_secondary} side stripe, {home_primary} socks with
      {home_secondary} band. Player two: same invented style in
      {away_primary} / {away_secondary}. Vast modern stadium bowl,
      blurred glowing crowd, golden-hour sun flare, sparks, lush pitch.
      Premium high-contrast 8K, Nikon Z9 35mm, shallow depth of field.
      CRITICAL IP SAFETY: no real team kit, no club logos, crests,
      sponsor text, maker marks, team names, advertising, or real
      player likenesses. Only a plain squad number is allowed.

  - key: 2-golden-duel-2col
    title: "Golden-hour duel"
    category: head-to-head
    enabled: true
    has_players: true
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, tight dynamic
      lower-body action crop, low pitch-level angle. Two anonymous
      footballers competing for a plain unbranded white-and-black ball,
      motion blur, turf spray. Player one invented halved kit
      {home_primary}/{home_secondary}; player two
      {away_primary}/{away_secondary} (plain number, side-stripe shorts,
      banded socks). Golden-hour sun flare behind a vast stadium bowl,
      blurred crowd, haze, sparks. Premium 8K, Nikon Z9 35mm.
      CRITICAL IP SAFETY: no real team kit, club logos, crests, sponsor
      text, team names, advertising, or real player likenesses.

  - key: 3-night-duel-2col
    title: "Night floodlit duel"
    category: head-to-head
    enabled: true
    has_players: true
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, moody NIGHT
      match under white floodlights. Two anonymous footballers
      competing for a plain unbranded ball, explosive action, motion
      blur, turf spray, volumetric light shafts, fog, sparks. Player
      one invented halved kit {home_primary}/{home_secondary}; player
      two {away_primary}/{away_secondary}. Vast dark stadium bowl,
      blurred crowd, deep blue night sky. 8K, Nikon Z9 35mm.
      CRITICAL IP SAFETY: no real team kit, club logos, crests, sponsor
      text, team names, advertising, or real player likenesses.

  - key: 4-explosive-duel-2col
    title: "Explosive low-angle duel"
    category: head-to-head
    enabled: true
    has_players: true
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, very low
      ground-level angle, the most explosive 1v1 duel: two anonymous
      footballers lunging for a plain unbranded ball low between them,
      huge turf and water spray, strong motion blur. Player one
      invented halved kit {home_primary}/{home_secondary}; player two
      {away_primary}/{away_secondary}. Vast stadium at night, blurred
      crowd, floodlights, sparks. 8K, Nikon Z9 35mm.
      CRITICAL IP SAFETY: no real team kit, club logos, crests, sponsor
      text, team names, advertising, or real player likenesses.

  - key: foot-v1-flare
    title: "Foot v foot — sun flare"
    category: head-to-head
    enabled: true
    has_players: false   # boots/socks only — grey area, Mark to confirm
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, extreme
      close-up at grass level: two opposing players' boots meeting over
      a plain unbranded white-and-black football on dewy grass, one
      boot on top of the ball. Left sock solid {home_primary} with a
      {home_secondary} band; right sock solid {away_primary} with an
      {away_secondary} band. Vast stadium blurred to glowing bokeh,
      floodlights and bright central sun flare, droplets, particles,
      shallow depth of field. 8K, Nikon Z9 100mm macro.
      CRITICAL IP SAFETY: plain ball and boots, no brand, logos,
      sponsor text, crests, advertising, team names, or real player
      likenesses.

  - key: foot-v3-strike
    title: "Foot v foot — strike clash"
    category: head-to-head
    enabled: true
    has_players: false
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, dynamic
      close-up low angle: the instant two opposing players' boots clash
      at a plain unbranded ball on dewy grass, slight motion blur, turf
      and water exploding off the ball. Left sock solid {home_primary}
      with {home_secondary} band; right sock solid {away_primary} with
      {away_secondary} band. Golden-hour sun flare, vast stadium bokeh,
      sparks, haze. 8K, Nikon Z9 100mm.
      CRITICAL IP SAFETY: plain ball and boots, no brand, logos,
      sponsor text, crests, advertising, team names, or real player
      likenesses.

  - key: foot-v4-groundlevel
    title: "Foot v foot — ground level"
    category: head-to-head
    enabled: true
    has_players: false
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, ultra-low
      camera on the turf: a plain unbranded ball huge in the foreground
      with two pairs of players' lower legs and boots framing it. Left
      legs in solid {home_primary} socks with {home_secondary} band;
      right legs in solid {away_primary} socks with {away_secondary}
      band. Vast packed stadium at dusk dissolved to bokeh, floodlight
      starbursts, warm sky, particles. 8K, Nikon Z9 24mm low macro.
      CRITICAL IP SAFETY: plain ball and boots, no brand, logos,
      sponsor text, crests, advertising, team names, or real player
      likenesses.

  # ---------- CLUB SPOTLIGHT (one team's colours, supporters) ----------

  - key: 4b-hero-2col
    title: "Single player hero"
    category: club-spotlight
    enabled: true
    has_players: true    # invented player — Mark prefers supporters
    needs: [home]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, dramatic low
      pitch-level angle. A single anonymous footballer mid-strike
      kicking a plain unbranded ball, motion blur, turf spray. Invented
      halved kit: left half {home_primary}, right half {home_secondary},
      plain number, {home_primary} shorts with {home_secondary} stripe,
      {home_primary} socks with {home_secondary} band. Vast stadium
      bowl, blurred glowing crowd, golden-hour flare, sparks. 8K,
      Nikon Z9 35mm. CRITICAL IP SAFETY: no real team kit, club logos,
      crests, sponsor text, team names, advertising, or real player
      likenesses.

  - key: crowd-night
    title: "Home crowd — dusk"
    category: club-spotlight
    enabled: true
    has_players: false
    needs: [home]
    prompt: |
      Ultra-photorealistic editorial sports photograph from inside a
      packed stand at eye level among home supporters at dusk,
      floodlights on, deep blue sky. A dense joyous crowd of diverse
      anonymous fans of all ages in plain solid {home_primary} casual
      clothing (plain tops/hoodies, no logos) holding plain
      {home_primary}-and-{home_secondary} scarves overhead, arms
      raised, singing, a child on shoulders. Green pitch just visible
      far below. Electric emotion, gritty documentary, 8K, Nikon Z9
      35mm. CRITICAL IP SAFETY: plain clothing only, no kits, club
      crests, sponsor or maker logos, text/emblems on scarves,
      advertising, real venue, or real player likenesses.

  - key: crowd-goldenhour
    title: "Home crowd — golden hour"
    category: club-spotlight
    enabled: true
    has_players: false
    needs: [home]
    prompt: |
      Ultra-photorealistic editorial sports photograph from inside a
      packed traditional stand at golden hour, warm low sun, steel-roof
      terrace. A dense crowd of diverse anonymous fans across
      generations in plain solid {home_primary} and {home_secondary}
      casual clothing (no logos), holding plain
      {home_primary}-and-{home_secondary} scarves overhead, clapping,
      singing, backlit by the sunset. Pitch edge visible far left.
      Nostalgic, emotional, warm cinematic, 8K, Nikon Z9 35mm.
      CRITICAL IP SAFETY: plain clothing only, no kits, club crests,
      sponsor or maker logos, text/emblems on scarves, advertising,
      real venue, or real player likenesses.

  - key: fan-hero-day
    title: "Fan hero — daytime"
    category: club-spotlight
    enabled: true
    has_players: false
    needs: [home]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, dramatic low
      angle looking up at two or three jubilant anonymous supporters in
      the stand on a bright sunny day, vivid blue sky with sun flare, a
      vast modern stadium bowl behind blurred to glowing bokeh. Fans in
      plain solid {home_primary} casual clothing (no logos); one holds
      a plain {home_primary}-and-{home_secondary} scarf stretched high
      overhead, mid-roar, pure elation. Heroic premium composite, 8K,
      Nikon Z9 35mm. CRITICAL IP SAFETY: plain clothing only, no kits,
      club crests, sponsor or maker logos, text/emblems on the scarf,
      advertising, real venue, or real player likenesses.

  # ---------- STADIUM ATMOSPHERE (generic, no team) ----------

  - key: B-fan-pov
    title: "Fan POV from stands"
    category: stadium-atmosphere
    enabled: true
    has_players: false
    needs: []
    prompt: |
      Ultra-photorealistic editorial sports photograph from deep in the
      stands of a large modern stadium at night, over the dark
      silhouetted backs and raised arms of a dense crowd, down onto a
      brilliant green floodlit pitch far below with tiny distant
      anonymous players mid-game. Plain scarves and flags overhead with
      NO text or emblems, phones raised, electric atmosphere, haze in
      the floodlight beams. Foreground fans in shadow as silhouettes.
      Cinematic, gritty, 8K, Nikon Z9 24mm. CRITICAL IP SAFETY: no club
      logos, crests, text on scarves/flags, sponsor text, advertising,
      naming-rights signage, or real player likenesses.

  - key: A-ball-motion
    title: "Cinematic ball in motion"
    category: stadium-atmosphere
    enabled: true
    has_players: false
    needs: []
    prompt: |
      Ultra-photorealistic cinematic sports photograph: extreme
      close-up of a plain unbranded white-and-black football frozen in
      mid-air just after being struck, sharp motion blur, water and
      turf particles spraying off it. Behind, a huge modern stadium at
      night fully out of focus into creamy bokeh, blurred crowd lights,
      floodlight flare, warm sparks. Shallow depth of field, dramatic
      backlight, low angle, 8K, Nikon Z9 200mm f/2. CRITICAL IP SAFETY:
      plain ball, no brand, maker mark or logo; no crests, sponsor
      text, advertising, readable signage, people in focus, or real
      player likenesses.

  - key: 3-pitch-tunnel
    title: "Pitch / tunnel pre-match"
    category: stadium-atmosphere
    enabled: true
    has_players: false
    needs: []
    prompt: |
      Ultra-photorealistic editorial photograph from pitch level inside
      a large modern generic stadium before kickoff. View from the dark
      players' tunnel toward a perfectly mown empty green pitch under
      intense white floodlights. Tiered stands fill with blurred
      distant supporters, dramatic light shafts, lens flare, faint mist,
      quiet anticipation. Nikon Z9 24mm wide, dark foreground,
      cinematic, 8K. CRITICAL IP SAFETY: invented generic stadium, no
      real venue, no club logos, crests, sponsor text, advertising,
      branded kits, signage, team names, or real player likenesses.

  - key: 5b-epic-bowl
    title: "Epic wide stadium bowl"
    category: stadium-atmosphere
    enabled: true
    has_players: false
    needs: []
    prompt: |
      Ultra-photorealistic cinematic sports photograph, wide elevated
      high-angle view inside a vast generic modern stadium at night,
      completely packed, every tier full, brilliant floodlights, lush
      green pitch glowing far below, scattered phone-camera flashes like
      stars, haze, deep blue night sky above an open roof. Electric,
      epic scale. 8K, Nikon Z9 24mm wide, slight tilt-shift. CRITICAL
      IP SAFETY: invented fictional stadium, no real venue, no club
      logos, crests, sponsor text, advertising, scoreboard text,
      signage, team names, or real player likenesses.
