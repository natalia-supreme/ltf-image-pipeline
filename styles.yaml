      lighting, each drummer prominent and centred in its own half,
      bright central light burst on the seam. Gritty documentary
      realism, cinematic, 8K, Nikon Z9 35mm, diverse anonymous faces.
      CRITICAL IP SAFETY: plain clothing and plain drums only, no
      kits, club crests, sponsor/maker logos, no text or emblems on
      scarves, drums or flags, no real venue, no real player
      likeness, no readable text anywhere.
