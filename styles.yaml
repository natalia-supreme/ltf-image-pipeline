      CENTERED in the right half: a mirrored opposing fan mid-beat on
      a plain unbranded drum, behind him a dense floodlit crowd in
      plain solid {away_primary} and {away_secondary} casual clothing
      with plain {away_primary}-and-{away_secondary} scarves and
