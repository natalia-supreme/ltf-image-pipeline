      CRITICAL IP SAFETY: no real team kit, club logos, crests, sponsor
      text, team names, advertising, or real player likenesses.

  - key: foot-v1-flare
    title: "Foot v foot — sun flare"
    category: head-to-head
    enabled: true
    has_players: false   # boots/socks only — grey area, Mark to confirm
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, extreme
      close-up at grass level: two opposing players' boots meeting over
      a plain unbranded white-and-black football on dewy grass, one
      boot on top of the ball. Left sock solid {home_primary} with a
      {home_secondary} band; right sock solid {away_primary} with an
      {away_secondary} band. Vast stadium blurred to glowing bokeh,
      floodlights and bright central sun flare, droplets, particles,
      shallow depth of field. 8K, Nikon Z9 100mm macro.
      CRITICAL IP SAFETY: plain ball and boots, no brand, logos,
      sponsor text, crests, advertising, team names, or real player
      likenesses.

  - key: foot-v3-strike
    title: "Foot v foot — strike clash"
    category: head-to-head
    enabled: true
    has_players: false
    needs: [home, away]
    prompt: |
      Ultra-photorealistic cinematic sports photograph, dynamic
